[build-system]
requires = ["setuptools==82.0.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "langbot-unified-attachment-pipeline"
version = "0.1.0"
description = "A local-first attachment ingestion and version-aware memory core for LangBot-style agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Unified Attachment Pipeline Contributors" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "beautifulsoup4==4.15.0",
  "openpyxl==3.1.5",
  "Pillow==12.3.0",
  "pypdf==6.15.0",
  "python-docx==1.2.0",
  "python-pptx==1.0.2",
]

[project.optional-dependencies]
pdf-vision = ["pypdfium2==5.12.1"]
windows-office = ["pywin32==311; platform_system == 'Windows'"]
test = [
  "pypdfium2==5.12.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "reportlab==5.0.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["langbot_unified_pipeline"]
branch = true
omit = ["*/office_worker.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
